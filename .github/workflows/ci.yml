name: CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Отримання коду
        uses: actions/checkout@v4

      - name: Встановлення PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Перевірка синтаксису PHP
        run: for f in *.php; do php -l $f; done

      - name: Встановлення залежностей
        run: composer install

      - name: Запуск тестів
        run: vendor/bin/phpunit

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Вхід у GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Збірка і публікація Docker-образу
        run: |
          IMAGE=ghcr.io/${{ github.repository_owner }}/uniform-orders
          docker build -t $IMAGE:latest .
          docker push $IMAGE:latest

      - name: Запуск застосунку з БД і перевірка стану (моніторинг)
        run: |
          docker compose up -d
          for i in $(seq 1 40); do
            if curl -sf http://localhost:8080/health.php; then echo; echo "Застосунок працює"; exit 0; fi
            sleep 3
          done
          echo "Застосунок не відповідає"
          exit 1

      - name: Логи контейнерів
        if: always()
        run: |
          docker compose ps
          docker compose logs --tail=30 app
